<!doctype html>
<html lang="ru" data-theme="gruvbox" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Протокол</title>
    <script>
      // The theme is applied before the first paint so that a dark user never
      // sees a white flash. The dark half is the default; the light half is
      // the one that has to be asked for.
      (function () {
        try {
          var saved = localStorage.getItem("sttshka.theme");
          var mode = saved === "light" ? "light" : "dark";
          document.documentElement.setAttribute("data-mode", mode);
        } catch (error) {
          document.documentElement.setAttribute("data-mode", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
