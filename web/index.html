    <title>Протокол — приватная расшифровка встреч</title>
    <script>
      // Apply the saved theme before first paint so dark users get no white flash.
      try {
        if (localStorage.getItem("sttshka.theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
